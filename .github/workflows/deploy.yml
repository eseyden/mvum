name: Build data and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Weekly refresh of map PDFs and USFS road/trail dates (Mondays 12:00 UTC).
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Re-download and re-tile every map
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PMTILES_VERSION: 1.31.2

jobs:
  build:
    runs-on: ubuntu-24.04
    # Current GDAL with PDF rendering. Ubuntu's packaged GDAL (3.8) silently writes PNG
    # tiles when asked for WEBP, roughly tripling map download sizes.
    container: ghcr.io/osgeo/gdal:ubuntu-full-3.13.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pmtiles
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          curl -fsSL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin pmtiles
          gdalinfo --version
          gdalinfo --formats | grep -E '^\s*(PDF|MBTiles|WEBP)'
          pmtiles version

      # Reuse downloaded PDFs and generated tiles so unchanged maps aren't re-tiled.
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/cache
            public/maps
          key: mvum-data-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mvum-data-v2-

      - run: npm ci

      - name: Build map tiles and data snapshot
        run: npm run data -- ${{ inputs.force && '--force' || '' }}

      # Save even on failure so a re-run resumes instead of re-tiling every map.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/cache
            public/maps
          key: mvum-data-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
